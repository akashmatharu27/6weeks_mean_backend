name: bicycle_backend

on:
  push:
    branches:
      - main

jobs:
  Deploy:
    runs-on: ubuntu-latest
    steps:
      - name: git library
        uses: actions/checkout@v4
      - name: connection
        uses: appleboy/ssh-action@v1.2.0

        with:
          host: ${{secrets.IP}}
          username: ${{secrets.USERNAME}}
          key: ${{secrets.PEM_KEY}}

          script: |
            cd /home/ubuntu/6weeks_mean_backend
            git pull origin main
            sudo npm i
            pm2 restart backend || pm2 start index.js --name "backend"
            pm2 save
